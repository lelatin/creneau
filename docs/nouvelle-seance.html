</header>
<main>


    <section class="narrow">
      <a href="tableau.html" class="back">← Mes séances</a>
      <h1>Nouvelle séance</h1>
      
      <form method="post" action="tableau.html" class="stack">
        
  <label class="field">
    <span>Nom du cours</span>
    <input type="text" name="title" value=""
       required maxlength="80" placeholder="Yoga doux" list="titles">
    
  </label>
        <div class="grid2">
          
  <label class="field">
    <span>Date</span>
    <input type="date" name="date" value="2026-11-27"
       required>
    
  </label>
          
  <label class="field">
    <span>Heure</span>
    <input type="time" name="time" value="18:30"
       required>
    
  </label>
        </div>
        <div class="grid2">
          
  <label class="field">
    <span>Durée (minutes)</span>
    <input type="number" name="duration_min" value="60"
       required min="10" max="600" step="5">
    
  </label>
          
  <label class="field">
    <span>Places</span>
    <input type="number" name="capacity" value="12"
       required min="1" max="500">
    
  </label>
        </div>
        
  <label class="field">
    <span>Lieu</span>
    <input type="text" name="location" value=""
       maxlength="200" placeholder="Parc de la Tête d&#39;Or, entrée Enfants du Rhône — ou lien visio">
    
  </label>
        
  <label class="field">
    <span>Prix (€)</span>
    <input type="text" name="price" value=""
       inputmode="decimal" placeholder="15">
    <small>Laissez vide pour ne pas afficher de prix, 0 pour « Gratuit ». Réglé directement avec vous.</small>
  </label>
        <label class="field">
          <span>Infos pour les élèves (facultatif)</span>
          <textarea name="description" rows="3" maxlength="1000" placeholder="Apportez votre tapis et une gourde."></textarea>
        </label>
        <label class="field">
          <span>Répéter</span>
          <select name="repeat">
            <option value="1" selected>
              Une seule fois</option><option value="2">
              Chaque semaine, 2 fois</option><option value="4">
              Chaque semaine, 4 fois</option><option value="8">
              Chaque semaine, 8 fois</option><option value="12">
              Chaque semaine, 12 fois</option>
          </select>
        </label>
        <button class="btn">Créer la séance</button>
      </form>
      <datalist id="titles"><option value="Méditation"><option value="Vinyasa flow"><option value="Pilates"><option value="Yoga doux"></datalist>
    </section>
</main>
<footer class="foot">Créneau · fait avec soin pour les indépendant·e·s</footer>
<script>
document.addEventListener('submit', (e) => {
  if (e.defaultPrevented) return;
  e.preventDefault();
  const to = e.target.getAttribute('action');
  if (to && to !== '#') location.href = to;
  else alert("Aperçu : cette action n'est pas disponible dans la démonstration.");
});
</script>
</body>
</html>
