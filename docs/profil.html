<script>
document.addEventListener('submit', (e) => {
  if (e.defaultPrevented) return;
  e.preventDefault();
  const to = e.target.getAttribute('action');
  if (to && to !== '#') location.href = to;
  else alert("Aperçu : cette action n'est pas disponible dans la démonstration.");
});
